name: Package Audit

on:
  workflow_call:
    inputs:
      package-manager:
        description: Package manager used by the selected working directories
        required: true
        type: string
      working-directories:
        description: JSON array of package directories, such as [".","apps/docs"]
        required: true
        type: string
      audit-level:
        description: Minimum npm or pnpm audit severity that fails the check
        required: false
        type: string
        default: high
      production-only:
        description: Audit production dependencies only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    if: (inputs.package-manager == 'npm' || inputs.package-manager == 'pnpm') && fromJSON(inputs.working-directories)[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        working-directory: ${{ fromJSON(inputs.working-directories) }}
    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Run npm audit
        if: inputs.package-manager == 'npm'
        shell: bash
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
          PRODUCTION_ONLY: ${{ inputs.production-only }}
        run: |
          if [[ "$PRODUCTION_ONLY" == 'true' ]]; then
            npm audit --omit=dev --audit-level="$AUDIT_LEVEL"
          else
            npm audit --audit-level="$AUDIT_LEVEL"
          fi
      - name: Run pnpm audit
        if: inputs.package-manager == 'pnpm'
        shell: bash
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
          PRODUCTION_ONLY: ${{ inputs.production-only }}
        run: |
          if [[ "$PRODUCTION_ONLY" == 'true' ]]; then
            pnpm audit --prod --audit-level="$AUDIT_LEVEL"
          else
            pnpm audit --audit-level="$AUDIT_LEVEL"
          fi
