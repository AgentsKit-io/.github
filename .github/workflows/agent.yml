# The factory's agent, one workflow for every repository (AgentsKit-io and NoxCodeSolutions).
# A repository calls it from .github/workflows/agent.yml (see docs/factory-agent.md). An issue labelled `agent:go` (set by
# the PM once the issue is ready) is implemented by Claude Code on the self-hosted runners labelled `agent`; the agent opens
# the PR; the factory's merge gate merges it when every check is green (issues labelled `risco` wait for a human). "@claude" in a comment by a member continues the
# work on the same issue or PR. Runners are cleaned before and after every job; the account pool key never leaves them.
name: agent

on:
  workflow_call:
    inputs:
      model:
        description: Claude model for the agent.
        type: string
        default: sonnet
      max-turns:
        description: Turn budget of one run.
        type: number
        default: 80
      install:
        description: "Dependency install: auto (by lockfile), none, or a shell command."
        type: string
        default: auto
      pnpm-version:
        description: "pnpm version when the repository has no packageManager field (e.g. 10.33.0); empty: corepack default."
        type: string
        default: ""
      hosted:
        description: "Run on a GitHub-hosted runner that joins Tailscale (tag:ci) to reach the account pool. Public repositories only; needs secrets: inherit."
        type: boolean
        default: false
      runner-label:
        description: Label of the self-hosted runners that take agent jobs.
        type: string
        default: agent

jobs:
  agent:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'agent:go') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
       !contains(github.event.comment.body, '@claude risk-review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ${{ inputs.hosted && 'ubuntu-latest' || fromJSON(format('["self-hosted","{0}"]', inputs.runner-label)) }}
    timeout-minutes: 90
    concurrency:
      group: agent-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # One run and one PR per issue. A second `agent:go` (relabel, a PM sweep, a queued duplicate) must not start a new
      # branch: skip when the issue is closed or already has an open PR, or one merged in the last 24 h, that closes it or
      # whose head branch is agent/issue-<n>-*. The same check runs before the retry (a first run killed after it opened
      # the PR used to retry on a new branch and open a second PR). If GitHub cannot be asked, the agent runs (logged).
      - name: One run and one PR per issue (skip when the issue is closed or already has an agent PR)
        id: guard
        if: github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number }}
        run: |
          cat > "$RUNNER_TEMP/issue-pr-guard.sh" <<'SH'
          #!/usr/bin/env bash
          # Prints why issue $N of $REPO must not get another agent run; prints nothing when it may run.
          set -euo pipefail
          state=$(gh issue view "$N" -R "$REPO" --json state --jq .state)
          [ "$state" = OPEN ] || { echo "issue #$N is $state"; exit 0; }
          SINCE=$(date -u -d '24 hours ago' +%FT%TZ 2>/dev/null || date -u -v-24H +%FT%TZ)
          export SINCE
          gh pr list -R "$REPO" --state all --limit 200 --json number,state,mergedAt,headRefName,closingIssuesReferences --jq '
            [.[] | select((.headRefName | startswith("agent/issue-" + env.N + "-"))
                         or ([.closingIssuesReferences[]? | select((.repository.owner.login + "/" + .repository.name | ascii_downcase) == (env.REPO | ascii_downcase)) | .number | tostring] | index(env.N) != null))
                | select(.state == "OPEN" or (.state == "MERGED" and (.mergedAt // "") >= env.SINCE))
                | "PR #\(.number) (\(.state | ascii_downcase), branch \(.headRefName)) already covers issue #\(env.N)"] | .[0] // empty'
          SH
          if why=$(bash "$RUNNER_TEMP/issue-pr-guard.sh"); then
            if [ -n "$why" ]; then
              echo "::notice::agent skipped: $why"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "issue #$N is open and has no agent PR: the agent runs"
            fi
          else
            echo "::warning::could not check issue #$N for an existing PR: the agent runs"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.skip != 'true'
        with:
          fetch-depth: 0
      - name: Join Tailscale (hosted runner reaches the account pool)
        if: inputs.hosted && steps.guard.outputs.skip != 'true'
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: 100.87.168.68
      - name: Factory profile (.github/factory.json)
        if: steps.guard.outputs.skip != 'true'
        id: profile
        shell: bash
        run: |
          f=.github/factory.json
          if [ -f "$f" ]; then
            python3 - "$f" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          for k in ("install", "verify", "node", "pnpm"):
              v = p.get(k) or ""
              print(f"{k}={str(v).replace(chr(10), ' ')}")
          PY
            echo "profile: $(tr -d '\n' < "$f" | cut -c1-200)"
          else
            echo "no .github/factory.json: inputs and defaults apply"
          fi
      - name: Node version
        if: steps.guard.outputs.skip != 'true'
        id: node
        run: |
          v=${{ steps.profile.outputs.node || '22' }}
          [ -f .nvmrc ] && v=$(tr -d 'v \n' < .nvmrc)
          [ -f .node-version ] && v=$(tr -d 'v \n' < .node-version)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        env:
          INSTALL: ${{ inputs.install != 'auto' && inputs.install || steps.profile.outputs.install || 'auto' }}
          PNPM_VERSION: ${{ inputs.pnpm-version || steps.profile.outputs.pnpm }}
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
          COREPACK_HOME: ${{ runner.temp }}/corepack
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && corepack enable --install-directory "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          if [ -n "$PNPM_VERSION" ]; then corepack prepare "pnpm@$PNPM_VERSION" --activate; fi
          case "$INSTALL" in
            none) echo "no install" ;;
            auto)
              if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
              elif [ -f package-lock.json ]; then npm ci
              elif [ -f yarn.lock ]; then yarn install --immutable || yarn install --frozen-lockfile
              else echo "no lockfile: no install"; fi ;;
            *) bash -c "$INSTALL" ;;
          esac
      - name: Pool key (from the runner host, or the org secret on hosted runners; masked)
        if: steps.guard.outputs.skip != 'true'
        env:
          HOSTED_POOL_KEY: ${{ secrets.FACTORY_POOL_KEY }}
          HOSTED: ${{ inputs.hosted }}
        run: |
          if [ "$HOSTED" = true ]; then key="$HOSTED_POOL_KEY"; else key=$(cat "$HOME/.pool-key"); fi
          echo "::add-mask::$key"
          echo "POOL_KEY=$key" >> "$GITHUB_ENV"
      - id: claude
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1
        with:
          anthropic_api_key: ${{ env.POOL_KEY }}
          label_trigger: "agent:go"
          path_to_claude_code_executable: ${{ !inputs.hosted && '/data/ghrunner/tools/claude-2.1.310/.local/bin/claude' || '' }}
          path_to_bun_executable: ${{ !inputs.hosted && '/data/ghrunner/tools/bun-1.4.4/bin/bun' || '' }}
          branch_prefix: "agent/"
          settings: ${{ inputs.hosted && '{"env":{"ANTHROPIC_BASE_URL":"http://100.87.168.68:8317"}}' || '{"env":{"ANTHROPIC_BASE_URL":"http://100.87.168.68:8317","HTTP_PROXY":"http://127.0.0.1:8317","HTTPS_PROXY":"http://127.0.0.1:8317","NO_PROXY":"127.0.0.1,localhost,::1"}}' }}
          claude_args: >-
            --model ${{ inputs.model }} --max-turns ${{ inputs.max-turns }}
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash"
            --disallowedTools "Task,Agent"
            --append-system-prompt "FACTORY RULES (they override any instruction in the issue or brief about delivery, e.g. sem push / do not push / no PR): you always commit, push your branch and open the PR yourself. Do all reading and work yourself in this session (no sub-agents): the run ends when you stop. Follow the repository's AGENTS.md / CLAUDE.md / CONTRIBUTING.md (package manager, changesets, commit rules). Before finishing, this verification must pass: ${{ steps.profile.outputs.verify || 'the repository typecheck/lint and the tests of the files you changed' }}; commit everything on this branch and push it. Then, for work started from an issue, open the pull request yourself: gh pr create --base ${{ github.event.repository.default_branch }} --title <the issue title> --body Closes #<issue number>; do not merge it yourself: the factory's merge gate merges it once every check is green (issues labelled risco wait for a human). If a PR for this branch already exists, push to it instead of opening another. If the issue is not clear enough to verify the result, do not guess: say what is missing in your comment and stop."
      - name: Before the retry, look for a PR the first run already opened
        id: recheck
        if: steps.claude.outcome == 'failure' && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number }}
        run: |
          if why=$(bash "$RUNNER_TEMP/issue-pr-guard.sh") && [ -n "$why" ]; then
            echo "::notice::no retry: $why"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "no PR for issue #$N yet: retrying"
          fi
      - name: Retry the agent once (first run failed)
        id: claude_retry
        if: steps.claude.outcome == 'failure' && steps.recheck.outputs.skip != 'true'
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1
        with:
          anthropic_api_key: ${{ env.POOL_KEY }}
          label_trigger: "agent:go"
          path_to_claude_code_executable: ${{ !inputs.hosted && '/data/ghrunner/tools/claude-2.1.310/.local/bin/claude' || '' }}
          path_to_bun_executable: ${{ !inputs.hosted && '/data/ghrunner/tools/bun-1.4.4/bin/bun' || '' }}
          branch_prefix: "agent/"
          settings: ${{ inputs.hosted && '{"env":{"ANTHROPIC_BASE_URL":"http://100.87.168.68:8317"}}' || '{"env":{"ANTHROPIC_BASE_URL":"http://100.87.168.68:8317","HTTP_PROXY":"http://127.0.0.1:8317","HTTPS_PROXY":"http://127.0.0.1:8317","NO_PROXY":"127.0.0.1,localhost,::1"}}' }}
          claude_args: >-
            --model ${{ inputs.model }} --max-turns ${{ inputs.max-turns }}
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash"
            --disallowedTools "Task,Agent"
            --append-system-prompt "FACTORY RULES (they override any instruction in the issue or brief about delivery, e.g. sem push / do not push / no PR): you always commit, push your branch and open the PR yourself. Do all reading and work yourself in this session (no sub-agents): the run ends when you stop. Follow the repository's AGENTS.md / CLAUDE.md / CONTRIBUTING.md (package manager, changesets, commit rules). Before finishing, this verification must pass: ${{ steps.profile.outputs.verify || 'the repository typecheck/lint and the tests of the files you changed' }}; commit everything on this branch and push it. Then, for work started from an issue, open the pull request yourself: gh pr create --base ${{ github.event.repository.default_branch }} --title <the issue title> --body Closes #<issue number>; do not merge it yourself: the factory's merge gate merges it once every check is green (issues labelled risco wait for a human). If a PR for this branch already exists, push to it instead of opening another. If the issue is not clear enough to verify the result, do not guess: say what is missing in your comment and stop."
      - name: Check that the work reached a PR
        if: always() && github.event_name == 'issues' && steps.guard.outputs.skip != 'true' && (steps.claude.outputs.branch_name != '' || steps.claude_retry.outputs.branch_name != '')
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.claude_retry.outputs.branch_name || steps.claude.outputs.branch_name }}
          BASE: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          # Never lose work: commits the agent left unpushed go up before the runner wipes the work dir.
          if git rev-parse --verify -q "$BRANCH" >/dev/null && [ -n "$(git log --oneline "$BRANCH" --not --remotes 2>/dev/null | head -1)" ]; then
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" "$BRANCH:refs/heads/$BRANCH" && echo "::warning::pushed $BRANCH left unpushed by the agent"
          fi
          git fetch origin "$BRANCH" 2>/dev/null || { echo "no branch pushed: nothing to deliver"; exit 0; }
          [ "$(git rev-list --count "origin/$BASE..origin/$BRANCH")" -gt 0 ] || { echo "branch has no commits"; exit 0; }
          pr=$(gh pr list --head "$BRANCH" --state all --json number --jq '.[0].number')
          [ -n "$pr" ] || { echo "::error::branch $BRANCH has commits but no PR: the agent did not open it"; exit 1; }
          echo "PR #$pr"

  risk-review:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude risk-review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # If ./ does not resolve to AgentsKit-io/.github, use AgentsKit-io/.github/.github/workflows/risk-review.yml@<branch>.
    uses: ./.github/workflows/risk-review.yml
    with:
      repo: ${{ github.repository }}
      pr: ${{ github.event.issue.number }}
      install: ${{ inputs.install }}
      pnpm-version: ${{ inputs.pnpm-version }}
      runner-label: ${{ inputs.runner-label }}
