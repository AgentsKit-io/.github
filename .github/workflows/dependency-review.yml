name: Dependency Review

on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: Minimum vulnerability severity that fails the check
        required: false
        type: string
        default: critical
      deny-licenses:
        description: Comma-separated SPDX license expressions to deny
        required: false
        type: string
        default: ''
      allow-licenses:
        description: Comma-separated SPDX license expressions to allow
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          deny-licenses: ${{ inputs.deny-licenses }}
          allow-licenses: ${{ inputs.allow-licenses }}
