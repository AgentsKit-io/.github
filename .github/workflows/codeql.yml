name: CodeQL

on:
  workflow_call:
    inputs:
      languages:
        description: Comma-separated CodeQL languages, for example javascript-typescript
        required: true
        type: string
      queries:
        description: CodeQL query suites or query paths
        required: false
        type: string
        default: security-extended
      build-mode:
        description: CodeQL build mode (none, autobuild, or manual)
        required: false
        type: string
        default: autobuild

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ inputs.languages }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ inputs.languages }}
          queries: ${{ inputs.queries }}
          build-mode: ${{ inputs.build-mode }}
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
